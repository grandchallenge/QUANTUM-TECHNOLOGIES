name: QTR C90 exact decoder execution

on:
  pull_request:
    paths:
      - "registry/qtr-c90-exact-decoder-001-manifest.json"
      - "work-packages/QTR-C90-EXACT-DECODER-001.md"
      - "reference/qtr_c90_exact_decoder_001.py"
      - "reference/qtr_c90_exact_dag_001.py"
      - "reference/qtr_c90_exact_execute_001.py"
      - "reference/qtr_c90_exact_sharded_001.py"
      - "tests/test_qtr_c90_exact_decoder_001.py"
      - "tests/test_qtr_c90_exact_engine_001.py"
      - ".github/workflows/qtr-c90-exact-decoder-001-execution.yml"
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  actions: read

env:
  SUBJECT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  quality-blind-controls:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SUBJECT_SHA }}
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.8"
      - name: Assert exact subject checkout
        run: test "$(git rev-parse HEAD)" = "$SUBJECT_SHA"
      - name: Restore promoted conventional comparison artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: TCM-QDEC-COMPARE-001-exact-head
          path: /tmp/tcm-qdec-compare-001
          github-token: ${{ github.token }}
          repository: grandchallenge/QUANTUM-TECHNOLOGIES
          run-id: 32079738866
      - name: Run exact-decoder bounded controls
        run: |
          python -m unittest discover -s tests -p "test_qtr_c90_exact_decoder_001.py" -v
          python -m unittest discover -s tests -p "test_qtr_c90_exact_engine_001.py" -v
          python -m py_compile reference/qtr_c90_exact_sharded_001.py
      - name: Verify original protected conventional per-input cells
        run: |
          python reference/qtr_c90_exact_execute_001.py \
            --mode verify-conventional \
            --conventional-artifact-dir /tmp/tcm-qdec-compare-001 \
            --output /tmp/QTR-C90-EXACT-DECODER-001-conventional-replay.json
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('/tmp/QTR-C90-EXACT-DECODER-001-conventional-replay.json').read_text())
          assert r['status']=='PROTECTED_CONVENTIONAL_C90_OUTCOMES_VERIFIED'
          assert r['quality_exposed'] is False
          assert r['new_c90_tcm_quality_exposed'] is False
          assert {k:v['oracle_success'] for k,v in r['methods'].items()} == {
              'BP_MIN_SUM': 200,
              'BP_OSD_CS_7': 211,
              'BP_SUM_PRODUCT': 171,
          }
          print('PROTECTED_CONVENTIONAL_C90_OUTCOMES_VERIFIED')
          PY
      - name: Preserve control receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: QTR-C90-EXACT-DECODER-001-controls
          path: /tmp/QTR-C90-EXACT-DECODER-001-conventional-replay.json
          if-no-files-found: error
          retention-days: 90

  compile-algebra:
    needs: quality-blind-controls
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        algebra:
          - sum_product_bsc_p_0_1
          - soft_tropical_base_2
          - min_plus_hamming
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SUBJECT_SHA }}
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.8"
      - name: Assert exact subject checkout
        run: test "$(git rev-parse HEAD)" = "$SUBJECT_SHA"
      - name: Compile one frozen exact algebra
        run: |
          mkdir -p /tmp/c90-compile
          python reference/qtr_c90_exact_sharded_001.py compile-algebra \
            --algebra "${{ matrix.algebra }}" \
            --compiled-output "/tmp/c90-compile/compiled-${{ matrix.algebra }}.json.gz" \
            --output "/tmp/c90-compile/compile-${{ matrix.algebra }}.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          algebra=os.environ['ALGEBRA']
          r=json.loads(Path(f'/tmp/c90-compile/compile-{algebra}.json').read_text())
          assert r['status']=='C90_EXACT_ALGEBRA_COMPILED_QUALITY_BLIND'
          assert r['quality_exposed'] is False
          print(algebra, r['compiled']['canonical_node_stream_sha256'])
          PY
        env:
          ALGEBRA: ${{ matrix.algebra }}
      - name: Preserve compiled algebra
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: QTR-C90-EXACT-DECODER-001-compiled-${{ matrix.algebra }}
          path: /tmp/c90-compile
          if-no-files-found: error
          retention-days: 90

  validate-shard:
    needs: compile-algebra
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        algebra:
          - sum_product_bsc_p_0_1
          - soft_tropical_base_2
          - min_plus_hamming
        shard:
          - { id: "00", start: 0, stop: 39 }
          - { id: "01", start: 39, stop: 78 }
          - { id: "02", start: 78, stop: 117 }
          - { id: "03", start: 117, stop: 156 }
          - { id: "04", start: 156, stop: 195 }
          - { id: "05", start: 195, stop: 234 }
          - { id: "06", start: 234, stop: 273 }
          - { id: "07", start: 273, stop: 307 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SUBJECT_SHA }}
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.8"
      - name: Assert exact subject checkout
        run: test "$(git rev-parse HEAD)" = "$SUBJECT_SHA"
      - name: Restore matching compiled algebra
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: QTR-C90-EXACT-DECODER-001-compiled-${{ matrix.algebra }}
          path: /tmp/c90-compiled
      - name: Validate exact frozen selector shard
        run: |
          mkdir -p /tmp/c90-validation
          python reference/qtr_c90_exact_sharded_001.py validate-shard \
            --algebra "${{ matrix.algebra }}" \
            --compiled "/tmp/c90-compiled/compiled-${{ matrix.algebra }}.json.gz" \
            --start "${{ matrix.shard.start }}" \
            --stop "${{ matrix.shard.stop }}" \
            --output "/tmp/c90-validation/validate-${{ matrix.algebra }}-${{ matrix.shard.id }}.json"
      - name: Preserve validation shard
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: QTR-C90-EXACT-DECODER-001-validation-${{ matrix.algebra }}-${{ matrix.shard.id }}
          path: /tmp/c90-validation
          if-no-files-found: error
          retention-days: 90

  aggregate-quality-blind:
    needs: validate-shard
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SUBJECT_SHA }}
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.8"
      - name: Assert exact subject checkout
        run: test "$(git rev-parse HEAD)" = "$SUBJECT_SHA"
      - name: Restore compiled algebras
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: QTR-C90-EXACT-DECODER-001-compiled-*
          path: /tmp/c90-compiled-all
          merge-multiple: true
      - name: Restore all exact validation shards
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: QTR-C90-EXACT-DECODER-001-validation-*
          path: /tmp/c90-validation-all
          merge-multiple: true
      - name: Restore conventional replay receipt
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: QTR-C90-EXACT-DECODER-001-controls
          path: /tmp/c90-controls
      - name: Aggregate complete quality-blind activation candidate
        run: |
          mapfile -t COMPILED < <(find /tmp/c90-compiled-all -type f -name 'compiled-*.json.gz' | sort)
          mapfile -t VALIDATION < <(find /tmp/c90-validation-all -type f -name 'validate-*.json' | sort)
          test "${#COMPILED[@]}" -eq 3
          test "${#VALIDATION[@]}" -eq 24
          ARGS=()
          for f in "${COMPILED[@]}"; do ARGS+=(--compiled "$f"); done
          for f in "${VALIDATION[@]}"; do ARGS+=(--validation "$f"); done
          python reference/qtr_c90_exact_sharded_001.py aggregate \
            "${ARGS[@]}" \
            --combined-output /tmp/QTR-C90-EXACT-DECODER-001-compiled.json.gz \
            --output /tmp/QTR-C90-EXACT-DECODER-001-quality-blind.json
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('/tmp/QTR-C90-EXACT-DECODER-001-quality-blind.json').read_text())
          assert r['status']=='C90_EXACT_IMPLEMENTATION_QUALITY_BLIND_VALIDATED'
          assert r['quality_exposed'] is False
          assert r['semantic_validation']['status']=='C90_EXACT_SEMANTIC_VALIDATION_PASSED'
          assert r['semantic_validation']['selector_count']==307
          assert r['semantic_validation']['quality_exposed'] is False
          assert r['execution_topology']['scientific_semantics_changed'] is False
          print('QUALITY_BLIND_VALIDATION_PASS', r['source_commit'])
          print(json.dumps(r['canonical_node_stream_sha256'], sort_keys=True))
          PY
          cp /tmp/c90-controls/QTR-C90-EXACT-DECODER-001-conventional-replay.json \
            /tmp/QTR-C90-EXACT-DECODER-001-conventional-replay.json
      - name: Preserve activation candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: QTR-C90-EXACT-DECODER-001-activation-candidate
          path: |
            /tmp/QTR-C90-EXACT-DECODER-001-compiled.json.gz
            /tmp/QTR-C90-EXACT-DECODER-001-quality-blind.json
            /tmp/QTR-C90-EXACT-DECODER-001-conventional-replay.json
          if-no-files-found: error
          retention-days: 90

  activation-gate:
    needs: aggregate-quality-blind
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require immutable execution-activation head on docket 114
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          repo=os.environ['GITHUB_REPOSITORY']
          sha=os.environ['SUBJECT_SHA']
          token=os.environ['GH_TOKEN']
          req=urllib.request.Request(
              f'https://api.github.com/repos/{repo}/issues/114/comments?per_page=100',
              headers={
                  'Authorization': f'Bearer {token}',
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
              },
          )
          with urllib.request.urlopen(req) as response:
              comments=json.load(response)
          marker=f'C90_EXECUTION_ACTIVATION_HEAD: {sha}'
          frozen='C90_EXECUTION_ACTIVATION: FROZEN'
          matched=[c for c in comments if marker in c.get('body','') and frozen in c.get('body','')]
          if len(matched) != 1:
              raise SystemExit(f'activation gate closed: expected exactly one docket marker for {sha}, found {len(matched)}')
          print(marker)
          print(frozen)
          PY

  execute-c90:
    needs: activation-gate
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SUBJECT_SHA }}
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.8"
      - name: Assert exact subject checkout
        run: test "$(git rev-parse HEAD)" = "$SUBJECT_SHA"
      - name: Restore exact activation candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: QTR-C90-EXACT-DECODER-001-activation-candidate
          path: /tmp/qtr-c90-activation
      - name: Restore original promoted conventional comparison artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: TCM-QDEC-COMPARE-001-exact-head
          path: /tmp/tcm-qdec-compare-001
          github-token: ${{ github.token }}
          repository: grandchallenge/QUANTUM-TECHNOLOGIES
          run-id: 32079738866
      - name: Execute 347 x 3 exact campaign and independently score
        run: |
          python reference/qtr_c90_exact_execute_001.py \
            --mode campaign \
            --activation-head "$SUBJECT_SHA" \
            --compiled /tmp/qtr-c90-activation/QTR-C90-EXACT-DECODER-001-compiled.json.gz \
            --validation-receipt /tmp/qtr-c90-activation/QTR-C90-EXACT-DECODER-001-quality-blind.json \
            --conventional-artifact-dir /tmp/tcm-qdec-compare-001 \
            --output /tmp/QTR-C90-EXACT-DECODER-001-result.json
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('/tmp/QTR-C90-EXACT-DECODER-001-result.json').read_text())
          assert r['status']=='C90_TCM_MATCHED_COMPARISON_COMPLETED'
          assert r['quality_exposed'] is True
          assert all(v['inputs']==347 for v in r['scoring_and_comparison']['tcm_totals'].values())
          assert len(r['scoring_and_comparison']['pairwise_contingency'])==9
          print('C90_TCM_MATCHED_COMPARISON_COMPLETED')
          print(json.dumps(r['scoring_and_comparison']['tcm_totals'], sort_keys=True))
          print(json.dumps(r['scoring_and_comparison']['pairwise_contingency'], sort_keys=True))
          PY
      - name: Preserve exact finite C90 result
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: QTR-C90-EXACT-DECODER-001-result
          path: /tmp/QTR-C90-EXACT-DECODER-001-result.json
          if-no-files-found: error
          retention-days: 90
