name: QTR C90 compact native evaluator controls

on:
  pull_request:
    paths:
      - "reference/qtr_c90_exact_native_eval_001.cpp"
      - "tests/test_qtr_c90_exact_native_eval_001.py"
      - ".github/workflows/qtr-c90-exact-decoder-001-native-eval-controls.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  SUBJECT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  exact-controls:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SUBJECT_SHA }}
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.8"
      - name: Assert exact subject checkout
        run: test "$(git rev-parse HEAD)" = "$SUBJECT_SHA"
      - name: Compile native evaluator
        run: g++ -std=c++17 -O3 -DNDEBUG reference/qtr_c90_exact_native_eval_001.cpp -o /tmp/qtr-c90-native-eval
      - name: Run exact evaluator controls
        run: |
          python -m unittest discover -s tests -p "test_qtr_c90_exact_native_eval_001.py" -v
          echo QUALITY_BLIND_NATIVE_EVALUATOR_EXACTNESS_PASS
