name: QTR C90 exact decoder joint MTBDD execution

on:
  pull_request:
    paths:
      - "registry/qtr-c90-exact-decoder-001-manifest.json"
      - "work-packages/QTR-C90-EXACT-DECODER-001.md"
      - "reference/qtr_c90_exact_decoder_001.py"
      - "reference/qtr_c90_exact_dag_001.py"
      - "reference/qtr_c90_exact_execute_001.py"
      - "reference/qtr_c90_exact_sharded_001.py"
      - "reference/qtr_c90_exact_jointdd_001.py"
      - "tests/test_qtr_c90_exact_decoder_001.py"
      - "tests/test_qtr_c90_exact_engine_001.py"
      - "tests/test_qtr_c90_exact_jointdd_001.py"
      - ".github/workflows/qtr-c90-exact-decoder-001-jointdd.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  issues: read

env:
  SUBJECT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  quality-blind-controls:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SUBJECT_SHA }}
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.8"
      - name: Assert exact subject checkout
        run: test "$(git rev-parse HEAD)" = "$SUBJECT_SHA"
      - name: Restore promoted conventional comparison artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: TCM-QDEC-COMPARE-001-exact-head
          path: /tmp/tcm-qdec-compare-001
          github-token: ${{ github.token }}
          repository: grandchallenge/QUANTUM-TECHNOLOGIES
          run-id: 32079738866
      - name: Run quality-blind joint-MTBDD controls
        run: |
          python -m unittest discover -s tests -p "test_qtr_c90_exact_decoder_001.py" -v
          python -m unittest discover -s tests -p "test_qtr_c90_exact_engine_001.py" -v
          python -m unittest discover -s tests -p "test_qtr_c90_exact_jointdd_001.py" -v
          python -m py_compile reference/qtr_c90_exact_jointdd_001.py
          python reference/qtr_c90_exact_execute_001.py \
            --mode verify-conventional \
            --conventional-artifact-dir /tmp/tcm-qdec-compare-001 \
            --output /tmp/QTR-C90-conventional-replay.json
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('/tmp/QTR-C90-conventional-replay.json').read_text())
          assert r['status']=='PROTECTED_CONVENTIONAL_C90_OUTCOMES_VERIFIED'
          assert r['quality_exposed'] is False
          assert r['new_c90_tcm_quality_exposed'] is False
          print('QUALITY_BLIND_JOINT_MTBDD_CONTROLS_PASS')
          PY

  compile-algebra:
    needs: quality-blind-controls
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        algebra:
          - sum_product_bsc_p_0_1
          - soft_tropical_base_2
          - min_plus_hamming
    env:
      ALGEBRA: ${{ matrix.algebra }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SUBJECT_SHA }}
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.8"
      - name: Assert exact subject checkout
        run: test "$(git rev-parse HEAD)" = "$SUBJECT_SHA"
      - name: Compile frozen algebra with exact joint MTBDD backend
        run: |
          mkdir -p /tmp/c90-jointdd
          python reference/qtr_c90_exact_jointdd_001.py \
            --algebra "$ALGEBRA" \
            --compiled-output "/tmp/c90-jointdd/compiled-$ALGEBRA.json.gz" \
            --output "/tmp/c90-jointdd/compile-$ALGEBRA.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          a=os.environ['ALGEBRA']
          r=json.loads(Path(f'/tmp/c90-jointdd/compile-{a}.json').read_text())
          assert r['status']=='C90_EXACT_ALGEBRA_COMPILED_QUALITY_BLIND'
          assert r['quality_exposed'] is False
          assert r['scientific_semantics_changed'] is False
          assert r['compiled']['backend']=='EXACT_JOINT_STABILIZER_SELECTOR_REDUCED_MTBDD'
          print(a, r['compiled']['canonical_node_stream_sha256'], r['compiled']['reachable_nodes'])
          PY
      - name: Preserve compiled algebra
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: QTR-C90-jointdd-compiled-${{ matrix.algebra }}
          path: |
            /tmp/c90-jointdd/compiled-${{ matrix.algebra }}.json.gz
            /tmp/c90-jointdd/compile-${{ matrix.algebra }}.json
          if-no-files-found: error
          retention-days: 90

  validate-shard:
    needs: compile-algebra
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        algebra:
          - sum_product_bsc_p_0_1
          - soft_tropical_base_2
          - min_plus_hamming
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    env:
      ALGEBRA: ${{ matrix.algebra }}
      SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SUBJECT_SHA }}
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.8"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: QTR-C90-jointdd-compiled-${{ matrix.algebra }}
          path: /tmp/c90-compiled
      - name: Validate deterministic frozen selector shard
        run: |
          start=$((SHARD * 39))
          stop=$((start + 39))
          if [ "$stop" -gt 307 ]; then stop=307; fi
          mkdir -p /tmp/c90-validation
          python reference/qtr_c90_exact_sharded_001.py validate-shard \
            --algebra "$ALGEBRA" \
            --compiled "/tmp/c90-compiled/compiled-$ALGEBRA.json.gz" \
            --start "$start" \
            --stop "$stop" \
            --output "/tmp/c90-validation/validation-$ALGEBRA-$SHARD.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          a=os.environ['ALGEBRA']; s=os.environ['SHARD']
          r=json.loads(Path(f'/tmp/c90-validation/validation-{a}-{s}.json').read_text())
          assert r['status']=='C90_EXACT_ALGEBRA_VALIDATION_SHARD_PASSED'
          assert r['quality_exposed'] is False
          print(a, s, r['selector_index_start'], r['selector_index_stop'], r['rows_sha256'])
          PY
      - name: Preserve validation shard
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: QTR-C90-jointdd-validation-${{ matrix.algebra }}-${{ matrix.shard }}
          path: /tmp/c90-validation/validation-${{ matrix.algebra }}-${{ matrix.shard }}.json
          if-no-files-found: error
          retention-days: 90

  aggregate-quality-blind:
    needs: validate-shard
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SUBJECT_SHA }}
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.8"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: QTR-C90-jointdd-compiled-*
          path: /tmp/c90-compiled
          merge-multiple: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: QTR-C90-jointdd-validation-*
          path: /tmp/c90-validation
          merge-multiple: true
      - name: Aggregate complete quality-blind proof
        run: |
          args=()
          while IFS= read -r f; do args+=(--compiled "$f"); done < <(find /tmp/c90-compiled -name 'compiled-*.json.gz' -type f | sort)
          while IFS= read -r f; do args+=(--validation "$f"); done < <(find /tmp/c90-validation -name 'validation-*.json' -type f | sort)
          test "${#args[@]}" -eq 54
          python reference/qtr_c90_exact_sharded_001.py aggregate \
            "${args[@]}" \
            --combined-output /tmp/QTR-C90-EXACT-DECODER-001-compiled.json.gz \
            --output /tmp/QTR-C90-EXACT-DECODER-001-quality-blind.json
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('/tmp/QTR-C90-EXACT-DECODER-001-quality-blind.json').read_text())
          assert r['status']=='C90_EXACT_IMPLEMENTATION_QUALITY_BLIND_VALIDATED'
          assert r['quality_exposed'] is False
          assert r['semantic_validation']['status']=='C90_EXACT_SEMANTIC_VALIDATION_PASSED'
          assert r['semantic_validation']['selector_count']==307
          assert r['semantic_validation']['quality_exposed'] is False
          assert r['execution_topology']['scientific_semantics_changed'] is False
          print('QUALITY_BLIND_VALIDATION_PASS', r['source_commit'])
          print(json.dumps(r['canonical_node_stream_sha256'], sort_keys=True))
          PY
      - name: Preserve activation candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: QTR-C90-EXACT-DECODER-001-jointdd-activation-candidate
          path: |
            /tmp/QTR-C90-EXACT-DECODER-001-compiled.json.gz
            /tmp/QTR-C90-EXACT-DECODER-001-quality-blind.json
          if-no-files-found: error
          retention-days: 90

  activation-gate:
    needs: aggregate-quality-blind
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Require immutable execution-activation head on docket 114
        run: |
          python - <<'PY'
          import json, os, urllib.request
          repo=os.environ['GITHUB_REPOSITORY']; sha=os.environ['SUBJECT_SHA']; token=os.environ['GH_TOKEN']
          req=urllib.request.Request(
              f'https://api.github.com/repos/{repo}/issues/114/comments?per_page=100',
              headers={'Authorization': f'Bearer {token}', 'Accept':'application/vnd.github+json', 'X-GitHub-Api-Version':'2022-11-28'},
          )
          with urllib.request.urlopen(req) as response: comments=json.load(response)
          marker=f'C90_EXECUTION_ACTIVATION_HEAD: {sha}'
          frozen='C90_EXECUTION_ACTIVATION: FROZEN'
          matched=[c for c in comments if marker in c.get('body','') and frozen in c.get('body','')]
          if len(matched) != 1:
              raise SystemExit(f'activation gate closed: expected exactly one docket marker for {sha}, found {len(matched)}')
          print(marker); print(frozen)
          PY

  execute-c90:
    needs: activation-gate
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SUBJECT_SHA }}
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.8"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: QTR-C90-EXACT-DECODER-001-jointdd-activation-candidate
          path: /tmp/qtr-c90-activation
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: TCM-QDEC-COMPARE-001-exact-head
          path: /tmp/tcm-qdec-compare-001
          github-token: ${{ github.token }}
          repository: grandchallenge/QUANTUM-TECHNOLOGIES
          run-id: 32079738866
      - name: Execute frozen 347 x 3 C90 campaign
        run: |
          python reference/qtr_c90_exact_execute_001.py \
            --mode campaign \
            --activation-head "$SUBJECT_SHA" \
            --compiled /tmp/qtr-c90-activation/QTR-C90-EXACT-DECODER-001-compiled.json.gz \
            --validation-receipt /tmp/qtr-c90-activation/QTR-C90-EXACT-DECODER-001-quality-blind.json \
            --conventional-artifact-dir /tmp/tcm-qdec-compare-001 \
            --output /tmp/QTR-C90-EXACT-DECODER-001-result.json
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('/tmp/QTR-C90-EXACT-DECODER-001-result.json').read_text())
          assert r['status']=='C90_TCM_MATCHED_COMPARISON_COMPLETED'
          print('C90_TCM_MATCHED_COMPARISON_COMPLETED')
          PY
      - name: Preserve completed C90 result
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: QTR-C90-EXACT-DECODER-001-jointdd-result
          path: /tmp/QTR-C90-EXACT-DECODER-001-result.json
          if-no-files-found: error
          retention-days: 90
