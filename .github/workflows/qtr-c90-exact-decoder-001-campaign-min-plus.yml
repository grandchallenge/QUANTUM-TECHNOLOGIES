name: QTR C90 activated exact decode min-plus

on:
  push:
    branches:
      - "execution/qtr-c90-exact-decoder-001-0c1f5591"
    paths:
      - ".github/workflows/qtr-c90-exact-decoder-001-campaign-min-plus.yml"
      - "reference/qtr_c90_exact_native_campaign_001.py"
      - "tests/test_qtr_c90_exact_native_campaign_001.py"

permissions:
  actions: read
  contents: read

env:
  ACTIVATION_HEAD: "0c1f5591a097adc285dec4cbfc320eeebd2c65d3"
  VALIDATION_RUN_ID: "35084118529"
  VALIDATION_ARTIFACT_ID: "10443207511"
  VALIDATION_ARTIFACT_DIGEST: "sha256:b91dd81d795822bd0f889a32b44f01b716d5b7ae097d83be5f43de95c9964bf8"
  ALGEBRA: "min_plus_hamming"
  ALGEBRA_ID: "2"
  COMPILE_ARTIFACT_ID: "10442143252"
  COMPILE_ARTIFACT_NAME: "QTR-C90-same-head-compile-min_plus_hamming"
  COMPILE_ARTIFACT_DIGEST: "sha256:6b9c94bd62cd4b3818396bc2c48b66cfe63958d37ce8d5ab2b846d0fb701d38f"
  NATIVE_BINARY_SHA256: "dd58a7e0c59626032d8714827d9f1097a33a78fd426c7d972407b32340890bb0"
  CANONICAL_NODE_STREAM_SHA256: "3aa3f0c1d97f7428623a034b6baa20e9c7f113e830b715040dc9e1e62967b4e8"
  COMPILE_RECEIPT_PAYLOAD_SHA256: "4a58ffb06bac564151c39f49416a9ca2d1b7b5de251fc2cb37046fab84af99f7"
  NATIVE_EVALUATOR_BLOB_SHA1: "92022fa89ceff9cf4ac0c9b6ce8613617664e1a6"
  DECODER_BLOB_SHA1: "7a275cd40b7ee8861ac1675791490b50d0266c50"
  EXECUTE_BLOB_SHA1: "f683e2af6671ef7f7908c09514d7fcab993755bc"
  C72_BLOB_SHA1: "164761a236ca53c919d810f0832cbcf3c1fb8989"
  DAG_BLOB_SHA1: "bb2576ea17beb43f1a188eb4a77a280869d0c954"

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      classes: ${{ steps.matrix.outputs.classes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.8"
      - name: Bind orchestration-only child to frozen activation head
        run: |
          test "$(git rev-parse HEAD^)" = "$ACTIVATION_HEAD"
          mapfile -t CHANGED < <(git diff --name-only "$ACTIVATION_HEAD" HEAD | sort)
          test "${#CHANGED[@]}" -eq 5
          printf '%s\n' "${CHANGED[@]}" | grep -Fx ".github/workflows/qtr-c90-exact-decoder-001-campaign-min-plus.yml"
          printf '%s\n' "${CHANGED[@]}" | grep -Fx ".github/workflows/qtr-c90-exact-decoder-001-campaign-soft-tropical.yml"
          printf '%s\n' "${CHANGED[@]}" | grep -Fx ".github/workflows/qtr-c90-exact-decoder-001-campaign-sum-product.yml"
          printf '%s\n' "${CHANGED[@]}" | grep -Fx "reference/qtr_c90_exact_native_campaign_001.py"
          printf '%s\n' "${CHANGED[@]}" | grep -Fx "tests/test_qtr_c90_exact_native_campaign_001.py"
          test "$(git hash-object reference/qtr_c90_exact_native_eval_001.cpp)" = "$NATIVE_EVALUATOR_BLOB_SHA1"
          test "$(git hash-object reference/qtr_c90_exact_decoder_001.py)" = "$DECODER_BLOB_SHA1"
          test "$(git hash-object reference/qtr_c90_exact_execute_001.py)" = "$EXECUTE_BLOB_SHA1"
          test "$(git hash-object reference/tcm_c72_interface_001.py)" = "$C72_BLOB_SHA1"
          test "$(git hash-object reference/qtr_c90_exact_dag_001.py)" = "$DAG_BLOB_SHA1"
      - name: Verify activation and same-head compile artifacts remain exact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          def artifact(aid):
              req=urllib.request.Request(
                  f"https://api.github.com/repos/grandchallenge/QUANTUM-TECHNOLOGIES/actions/artifacts/{aid}",
                  headers={"Authorization":f"Bearer {os.environ['GH_TOKEN']}","Accept":"application/vnd.github+json"},
              )
              with urllib.request.urlopen(req) as r: return json.load(r)
          validation=artifact(os.environ["VALIDATION_ARTIFACT_ID"])
          assert validation["digest"]==os.environ["VALIDATION_ARTIFACT_DIGEST"]
          assert validation["expired"] is False
          assert str(validation["workflow_run"]["id"])==os.environ["VALIDATION_RUN_ID"]
          assert validation["workflow_run"]["head_sha"]==os.environ["ACTIVATION_HEAD"]
          compiled=artifact(os.environ["COMPILE_ARTIFACT_ID"])
          assert compiled["name"]==os.environ["COMPILE_ARTIFACT_NAME"]
          assert compiled["digest"]==os.environ["COMPILE_ARTIFACT_DIGEST"]
          assert compiled["expired"] is False
          assert str(compiled["workflow_run"]["id"])==os.environ["VALIDATION_RUN_ID"]
          assert compiled["workflow_run"]["head_sha"]==os.environ["ACTIVATION_HEAD"]
          print("C90_ACTIVATED_CAMPAIGN_ARTIFACT_BINDING_PASS", validation["id"], compiled["id"])
          PY
      - name: Prove orchestration adapter without decoder-quality exposure
        run: python tests/test_qtr_c90_exact_native_campaign_001.py
      - id: matrix
        name: Freeze 256 logical-class shard matrix
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          print("classes="+json.dumps(list(range(256)),separators=(",",":")))
          PY

  evaluate:
    needs: preflight
    strategy:
      fail-fast: false
      max-parallel: 256
      matrix:
        logical_class: ${{ fromJSON(needs.preflight.outputs.classes) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    env:
      LOGICAL_CLASS: ${{ matrix.logical_class }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.8"
      - name: Restore exact same-head compiled algebra
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ env.COMPILE_ARTIFACT_NAME }}
          path: /tmp/c90-compiled
          github-token: ${{ github.token }}
          repository: grandchallenge/QUANTUM-TECHNOLOGIES
          run-id: ${{ env.VALIDATION_RUN_ID }}
      - name: Bind native binary and compile unchanged evaluator
        run: |
          mkdir -p /tmp/c90-campaign
          BINARY="$(find /tmp/c90-compiled -type f -name 'compiled-*.qtrbin' -print -quit)"
          RECEIPT="$(find /tmp/c90-compiled -type f -name 'compile-*.json' -print -quit)"
          test -n "$BINARY" && test -n "$RECEIPT"
          test "$(sha256sum "$BINARY" | awk '{print $1}')" = "$NATIVE_BINARY_SHA256"
          python - "$RECEIPT" <<'PY'
          import json, os, sys
          r=json.load(open(sys.argv[1]))
          assert r["source_commit"]==os.environ["ACTIVATION_HEAD"]
          assert r["payload_sha256"]==os.environ["COMPILE_RECEIPT_PAYLOAD_SHA256"]
          assert r["compiled"]["canonical_node_stream_sha256"]==os.environ["CANONICAL_NODE_STREAM_SHA256"]
          assert r["compiled"]["native_binary_sha256"]==os.environ["NATIVE_BINARY_SHA256"]
          assert r["quality_exposed"] is False
          PY
          printf '%s\n' "$BINARY" > /tmp/c90-campaign/native-path
          g++ -std=c++17 -O3 -DNDEBUG reference/qtr_c90_exact_native_eval_001.cpp -o /tmp/qtr-c90-native-eval
      - name: Generate frozen 347-selector logical-class shard
        run: |
          python reference/qtr_c90_exact_native_campaign_001.py selectors             --logical-class "$LOGICAL_CLASS"             --output /tmp/c90-campaign/selectors.txt
          test "$(wc -l < /tmp/c90-campaign/selectors.txt)" -eq 347
      - name: Execute exact activated selector shard
        run: |
          BINARY="$(cat /tmp/c90-campaign/native-path)"
          /usr/bin/time -v -o /tmp/c90-campaign/time.txt             /tmp/qtr-c90-native-eval               --native "$BINARY"               --selectors /tmp/c90-campaign/selectors.txt               > "/tmp/c90-campaign/rows-$ALGEBRA-class-$LOGICAL_CLASS.jsonl"
          test "$(wc -l < "/tmp/c90-campaign/rows-$ALGEBRA-class-$LOGICAL_CLASS.jsonl")" -eq 347
      - name: Fail closed on shard transport or semantic drift
        run: |
          python reference/qtr_c90_exact_native_campaign_001.py validate-shard             --algebra "$ALGEBRA"             --logical-class "$LOGICAL_CLASS"             --rows "/tmp/c90-campaign/rows-$ALGEBRA-class-$LOGICAL_CLASS.jsonl"             --output "/tmp/c90-campaign/receipt-$ALGEBRA-class-$LOGICAL_CLASS.json"
      - name: Preserve exact selector shard
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: QTR-C90-campaign-min-plus-class-${{ matrix.logical_class }}
          path: |
            /tmp/c90-campaign/rows-min_plus_hamming-class-${{ matrix.logical_class }}.jsonl
            /tmp/c90-campaign/receipt-min_plus_hamming-class-${{ matrix.logical_class }}.json
            /tmp/c90-campaign/time.txt
          if-no-files-found: error
          retention-days: 90
          compression-level: 6
