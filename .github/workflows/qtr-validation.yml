name: QTR validation

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: qtr-validation-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12.8"
      - name: Verify source and target payload identities
        run: |
          python ci/verify_migration.py \
            --target-commit "$GITHUB_SHA" \
            --output /tmp/QTR-BOOT-001-target-identity.json
      - name: Validate governed packet
        run: python ci/validate.py
      - name: Run reference tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Replay baseline report
        run: |
          python reference/signal_discovery.py --output /tmp/qtr-baseline.json
          python - <<'PY'
          import json
          from pathlib import Path
          expected = json.loads(Path("evidence/baseline-report.json").read_text())
          observed = json.loads(Path("/tmp/qtr-baseline.json").read_text())
          if observed != expected:
              raise SystemExit("baseline replay mismatch")
          print(observed["payload_sha256"])
          PY
      - name: Preserve target identity receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: QTR-BOOT-001-target-identity
          path: /tmp/QTR-BOOT-001-target-identity.json
          if-no-files-found: error
          retention-days: 90
