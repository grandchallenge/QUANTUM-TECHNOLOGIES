name: QTR validation

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: qtr-validation-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      SUBJECT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.SUBJECT_SHA }}
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12.8"
      - name: Assert exact subject checkout
        run: python ci/verify_migration.py --assert-head "$SUBJECT_SHA"
      - name: Verify historical migration identities
        run: |
          python ci/verify_migration.py \
            --verify-history \
            --evaluated-commit "$SUBJECT_SHA" \
            --output /tmp/QTR-ADOPT-CORR-001-exact-head-receipt.json
      - name: Validate governed packet and complete schema
        run: python ci/validate.py
      - name: Run reference and adversarial tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Replay baseline report
        run: |
          python reference/signal_discovery.py --output /tmp/qtr-baseline.json
          python - <<'PY'
          import json
          from pathlib import Path
          expected = json.loads(Path("evidence/baseline-report.json").read_text())
          observed = json.loads(Path("/tmp/qtr-baseline.json").read_text())
          if observed != expected:
              raise SystemExit("baseline replay mismatch")
          print(observed["payload_sha256"])
          PY
      - name: Preserve exact-head receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: QTR-ADOPT-CORR-001-exact-head-receipt
          path: /tmp/QTR-ADOPT-CORR-001-exact-head-receipt.json
          if-no-files-found: error
          retention-days: 90
