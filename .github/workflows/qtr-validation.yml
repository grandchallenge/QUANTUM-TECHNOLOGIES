name: QTR validation

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: qtr-validation-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SUBJECT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SUBJECT_SHA }}
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.8"
      - name: Assert exact subject checkout
        run: python ci/verify_migration.py --assert-head "$SUBJECT_SHA"
      - name: Verify historical migration identities
        run: |
          python ci/verify_migration.py \
            --verify-history \
            --evaluated-commit "$SUBJECT_SHA" \
            --output /tmp/QTR-ADOPT-CORR-001-exact-head-receipt.json
      - name: Validate adopted WP00 substrate
        run: python ci/validate.py
      - name: Validate promoted WP01 through bounded WP03 substrate
        run: python ci/validate_downstream.py
      - name: Validate promotion overlay
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          promotion = json.loads(Path("reviews/QTR-SIG-NEXT-001/promotion-record.json").read_text())
          intake = json.loads(Path("reviews/QTR-SIG-NEXT-001/intake.json").read_text())
          if promotion["status"] != "referee_promoted":
              raise SystemExit("promotion record status missing")
          if promotion["reviewed_head"] != "c6d3c460804bcc414226cac3700a864773ba2fdf":
              raise SystemExit("reviewed head mismatch")
          if promotion["scientific_merge_commit"] != "f96452e3eeb1688bf8eb60c7b22e3adf500bae39":
              raise SystemExit("scientific merge mismatch")
          if promotion["workflow_evidence"]["downstream_payload_sha256"] != "157351b5dc7fc907027ad4ef70ae56cd9af739fd87f9f744c346a795a59b21f6":
              raise SystemExit("reviewed evidence identity mismatch")
          if promotion["reviewed_snapshot"]["snapshot_preserved_byte_for_byte"] is not True:
              raise SystemExit("reviewed snapshot preservation missing")
          if intake["status"] != "candidate_implementation_ready":
              raise SystemExit("reviewed snapshot status changed")
          if intake["review_cycle_status"] != "completed_referee_promoted":
              raise SystemExit("review cycle is not closed")
          PY
      - name: Run reference and adversarial tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Replay WP00 baseline report
        run: |
          python reference/signal_discovery.py --output /tmp/qtr-baseline.json
          python - <<'PY'
          import json
          from pathlib import Path
          expected = json.loads(Path("evidence/baseline-report.json").read_text())
          observed = json.loads(Path("/tmp/qtr-baseline.json").read_text())
          if observed != expected:
              raise SystemExit("baseline replay mismatch")
          print(observed["payload_sha256"])
          PY
      - name: Write promoted exact-head receipt
        run: |
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path
          subject = "${{ env.SUBJECT_SHA }}"
          runtime = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          downstream = json.loads(Path("evidence/downstream-atlas-report.json").read_text())
          receipt = {
              "receipt_version": "0.2.0",
              "docket_id": "QTR-SIG-PIN-001",
              "evaluated_commit": subject,
              "runtime_head": runtime,
              "exact_head_equal": subject == runtime,
              "work_package_status": "referee_promoted",
              "reviewed_head": "c6d3c460804bcc414226cac3700a864773ba2fdf",
              "scientific_merge_commit": "f96452e3eeb1688bf8eb60c7b22e3adf500bae39",
              "downstream_payload_sha256": downstream["payload_sha256"],
              "WP04_status": "gated"
          }
          Path("/tmp/QTR-SIG-PIN-001-exact-head.json").write_text(json.dumps(receipt, indent=2, sort_keys=True) + "\n")
          if not receipt["exact_head_equal"]:
              raise SystemExit("promotion pin receipt head mismatch")
          PY
      - name: Preserve exact-head receipts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: QTR-SIG-PIN-001-exact-head
          path: |
            /tmp/QTR-ADOPT-CORR-001-exact-head-receipt.json
            /tmp/QTR-SIG-PIN-001-exact-head.json
          if-no-files-found: error
          retention-days: 90
