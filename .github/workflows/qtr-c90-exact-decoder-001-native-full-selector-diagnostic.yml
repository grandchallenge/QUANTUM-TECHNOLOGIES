name: QTR C90 full native selector diagnostic

on:
  pull_request:
    paths:
      - ".github/workflows/qtr-c90-exact-decoder-001-native-full-selector-diagnostic.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

env:
  SUBJECT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  DIAGNOSTIC_BASE_HEAD: "6e732b756a1f62c3f8a7228f43ea3ba879122d78"
  COMPILED_RUN_ID: "34947590855"
  COMPILED_ARTIFACT_ID: "10388753864"
  COMPILED_ARTIFACT_NAME: "QTR-C90-compact-native-sum_product_bsc_p_0_1"
  COMPILED_ARTIFACT_DIGEST: "sha256:1d852e71b93a9b1dcff7eba43b29a3f37e3095f63059ed26ab3c512b5d00fc4c"
  COMPILED_SOURCE_HEAD: "c4e1d757bdf89fa5eceaf2e38b8a34ff3ee3a78c"
  EVALUATOR_BLOB_SHA1: "92022fa89ceff9cf4ac0c9b6ce8613617664e1a6"
  DECODER_BLOB_SHA1: "7a275cd40b7ee8861ac1675791490b50d0266c50"

jobs:
  full-selector-zero:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SUBJECT_SHA }}
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.8"
      - name: Assert workflow-only diagnostic head and frozen evaluator
        run: |
          test "$(git rev-parse HEAD)" = "$SUBJECT_SHA"
          test "$(git rev-parse HEAD^)" = "$DIAGNOSTIC_BASE_HEAD"
          mapfile -t CHANGED < <(git diff --name-only "$DIAGNOSTIC_BASE_HEAD" "$SUBJECT_SHA" | sort)
          test "${#CHANGED[@]}" -eq 1
          test "${CHANGED[0]}" = ".github/workflows/qtr-c90-exact-decoder-001-native-full-selector-diagnostic.yml"
          test "$(git hash-object reference/qtr_c90_exact_native_eval_001.cpp)" = "$EVALUATOR_BLOB_SHA1"
          test "$(git hash-object reference/qtr_c90_exact_decoder_001.py)" = "$DECODER_BLOB_SHA1"
      - name: Verify preserved compiled artifact identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          req=urllib.request.Request(
              f"https://api.github.com/repos/grandchallenge/QUANTUM-TECHNOLOGIES/actions/artifacts/{os.environ['COMPILED_ARTIFACT_ID']}",
              headers={"Authorization":f"Bearer {os.environ['GH_TOKEN']}","Accept":"application/vnd.github+json"},
          )
          with urllib.request.urlopen(req) as response: meta=json.load(response)
          assert str(meta['id'])==os.environ['COMPILED_ARTIFACT_ID']
          assert meta['name']==os.environ['COMPILED_ARTIFACT_NAME']
          assert meta['digest']==os.environ['COMPILED_ARTIFACT_DIGEST']
          assert meta['expired'] is False
          assert str(meta['workflow_run']['id'])==os.environ['COMPILED_RUN_ID']
          assert meta['workflow_run']['head_sha']==os.environ['COMPILED_SOURCE_HEAD']
          print('C90_NATIVE_DIAGNOSTIC_ARTIFACT_IDENTITY_PASS', meta['id'], meta['digest'])
          PY
      - name: Restore preserved exact compiled DAG
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ env.COMPILED_ARTIFACT_NAME }}
          path: /tmp/c90-compiled
          github-token: ${{ github.token }}
          repository: grandchallenge/QUANTUM-TECHNOLOGIES
          run-id: ${{ env.COMPILED_RUN_ID }}
      - name: Prepare frozen selector zero and verify binary identity
        run: |
          mkdir -p /tmp/c90-diagnostic
          python - <<'PY'
          import json, sys
          from pathlib import Path
          sys.path.insert(0,'reference')
          import qtr_c90_exact_decoder_001 as Base
          import qtr_c90_exact_native_validate_001 as V
          receipt=Path('/tmp/c90-compiled/compile-sum_product_bsc_p_0_1.json')
          binary=Path('/tmp/c90-compiled/compiled-sum_product_bsc_p_0_1.qtrbin')
          r=V._load_receipt(receipt,'sum_product_bsc_p_0_1')
          assert r['source_commit']=='c4e1d757bdf89fa5eceaf2e38b8a34ff3ee3a78c'
          sha=V._file_sha256(binary)
          assert sha==r['compiled']['native_binary_sha256']=='2efe52e17c6d66920b23738987818184657caf479c60c78712dff6db4a306bde'
          coords=Base.frozen_validation_coordinates()
          assert len(coords)==307 and Base.digest(coords)==Base.C90_VALIDATION_SET_SHA and coords[0]==0
          Path('/tmp/c90-diagnostic/selector0.txt').write_text(f'0 {coords[0]}\n',encoding='utf-8')
          print('C90_NATIVE_DIAGNOSTIC_INPUT_PASS', sha, len(coords), Base.C90_VALIDATION_SET_SHA)
          PY
      - name: Build unchanged exact native evaluator
        run: g++ -std=c++17 -O3 -DNDEBUG reference/qtr_c90_exact_native_eval_001.cpp -o /tmp/qtr-c90-native-eval
      - name: Measure complete selector zero from scratch without checkpoint persistence
        run: |
          /usr/bin/time -v -o /tmp/c90-diagnostic/time.txt \
            /tmp/qtr-c90-native-eval \
              --native /tmp/c90-compiled/compiled-sum_product_bsc_p_0_1.qtrbin \
              --selectors /tmp/c90-diagnostic/selector0.txt \
            | tee /tmp/c90-diagnostic/native-selector0.jsonl
          python - <<'PY'
          import json, sys
          from pathlib import Path
          sys.path.insert(0,'reference')
          import qtr_c90_exact_decoder_001 as Base
          row=json.loads(Path('/tmp/c90-diagnostic/native-selector0.jsonl').read_text())
          assert row['status']=='C90_COMPACT_NATIVE_SELECTOR_EVALUATED'
          assert row['algebra_id']==0 and row['selector_index']==0 and row['selector_coordinate']==0
          assert row['quality_exposed'] is False
          receipt={
              'experiment_id': Base.EXPERIMENT_ID,
              'phase': 'QUALITY_BLIND_NATIVE_FULL_SELECTOR_DIAGNOSTIC',
              'status': 'C90_NATIVE_FULL_SELECTOR_DIAGNOSTIC_PASS',
              'validation_subject_commit': '${{ env.SUBJECT_SHA }}',
              'compiled_source_commit': 'c4e1d757bdf89fa5eceaf2e38b8a34ff3ee3a78c',
              'compiled_artifact_id': 10388753864,
              'compiled_artifact_digest': 'sha256:1d852e71b93a9b1dcff7eba43b29a3f37e3095f63059ed26ab3c512b5d00fc4c',
              'selector_index': 0,
              'selector_coordinate': 0,
              'reachable_nodes': int(row['reachable_nodes']),
              'peak_live_values': int(row['peak_live_values']),
              'quality_exposed': False,
              'injected_error_success_used': False,
              'scientific_semantics_changed': False,
          }
          receipt['payload_sha256']=Base.digest(receipt)
          Path('/tmp/c90-diagnostic/receipt.json').write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          print('C90_NATIVE_FULL_SELECTOR_DIAGNOSTIC_PASS', receipt['payload_sha256'])
          PY
      - name: Preserve quality-blind timing evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: QTR-C90-native-full-selector-diagnostic
          path: /tmp/c90-diagnostic/
          if-no-files-found: error
          retention-days: 30

# This workflow measures quality-blind semantic-validation execution only.
# It neither exposes decoder quality nor creates an execution-activation receipt.
