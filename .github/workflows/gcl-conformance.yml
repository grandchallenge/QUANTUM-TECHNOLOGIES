name: GCL conformance

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: gcl-conformance-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    name: policy
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      SUBJECT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SUBJECT_SHA }}
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.8"
      - name: Assert exact subject checkout
        run: python ci/verify_migration.py --assert-head "$SUBJECT_SHA"
      - name: Reject mutable action references
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          violations = []
          for path in sorted(Path('.github/workflows').glob('*.y*ml')):
              for number, line in enumerate(path.read_text(encoding='utf-8').splitlines(), 1):
                  match = re.search(r'\buses:\s*([^\s#]+)', line)
                  if not match:
                      continue
                  reference = match.group(1)
                  if reference.startswith('./'):
                      continue
                  if '@' not in reference or not re.search(r'@[0-9a-f]{40}$', reference):
                      violations.append(f'{path}:{number}: {reference}')
          if violations:
              raise SystemExit('mutable or unpinned action references:\n' + '\n'.join(violations))
          PY
      - name: Validate adopted programme and promoted downstream records
        run: |
          python ci/validate.py
          python ci/validate_downstream.py
          python - <<'PY'
          import json
          from pathlib import Path
          charter = Path('QTR-CHARTER-00.md').read_text(encoding='utf-8')
          wp00 = Path('work-packages/QTR-SIG-WP00.md').read_text(encoding='utf-8')
          adoption = json.loads(Path('reviews/QTR-ADOPT-001/adoption-record.json').read_text(encoding='utf-8'))
          intake = json.loads(Path('reviews/QTR-SIG-NEXT-001/intake.json').read_text(encoding='utf-8'))
          promotion = json.loads(Path('reviews/QTR-SIG-NEXT-001/promotion-record.json').read_text(encoding='utf-8'))
          if 'Status: `adopted`' not in charter:
              raise SystemExit('charter adoption status missing')
          if 'Status: `referee_promoted`' not in wp00:
              raise SystemExit('WP00 promotion status missing')
          for wp in ('QTR-SIG-WP01.md','QTR-SIG-WP02.md','QTR-SIG-WP03.md'):
              text = Path('work-packages', wp).read_text(encoding='utf-8')
              if 'Status: `referee_promoted`' not in text:
                  raise SystemExit(f'{wp}: promotion status missing')
              if 'c6d3c460804bcc414226cac3700a864773ba2fdf' not in text:
                  raise SystemExit(f'{wp}: reviewed head missing')
              if 'f96452e3eeb1688bf8eb60c7b22e3adf500bae39' not in text:
                  raise SystemExit(f'{wp}: promotion merge missing')
          if adoption['adoption_merge_commit'] != '0743ac9947cc835de817d50d92cf3df444132449':
              raise SystemExit('adoption merge commit not pinned')
          if intake['status'] != 'candidate_implementation_ready':
              raise SystemExit('reviewed snapshot status changed')
          if intake['review_cycle_status'] != 'completed_referee_promoted':
              raise SystemExit('review cycle status is stale')
          if promotion['status'] != 'referee_promoted':
              raise SystemExit('downstream promotion record is stale')
          if promotion['referee']['disposition'] != 'promote_for_bounded_merge':
              raise SystemExit('Referee disposition missing')
          if promotion['reviewed_snapshot']['snapshot_preserved_byte_for_byte'] is not True:
              raise SystemExit('reviewed snapshot preservation missing')
          if 'QTR-SIG-WP04' not in promotion['excluded_scope']:
              raise SystemExit('WP04 gate is not explicit')
          PY
      - name: Write conformance receipt
        run: |
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path
          subject = '${{ env.SUBJECT_SHA }}'
          runtime = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          receipt = {
              'receipt_version': '0.2.0',
              'docket_id': 'QTR-SIG-PIN-001',
              'evaluated_commit': subject,
              'runtime_head': runtime,
              'exact_head_equal': subject == runtime,
              'charter_status': 'adopted',
              'WP00_status': 'referee_promoted',
              'WP01_WP02_status': 'referee_promoted',
              'WP03_status': 'referee_promoted_bounded',
              'scientific_merge_commit': 'f96452e3eeb1688bf8eb60c7b22e3adf500bae39',
              'WP04_status': 'gated'
          }
          Path('/tmp/QTR-SIG-PIN-001-gcl-conformance.json').write_text(json.dumps(receipt, indent=2, sort_keys=True) + '\n')
          if not receipt['exact_head_equal']:
              raise SystemExit('conformance receipt head mismatch')
          PY
      - name: Preserve conformance receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: QTR-SIG-PIN-001-gcl-conformance
          path: /tmp/QTR-SIG-PIN-001-gcl-conformance.json
          if-no-files-found: error
          retention-days: 90
