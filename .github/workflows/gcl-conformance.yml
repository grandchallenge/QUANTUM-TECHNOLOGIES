name: GCL conformance

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: gcl-conformance-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    name: policy
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12.8"
      - name: Reject mutable action references
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          violations = []
          for path in sorted(Path('.github/workflows').glob('*.y*ml')):
              for number, line in enumerate(path.read_text(encoding='utf-8').splitlines(), 1):
                  match = re.search(r'\buses:\s*([^\s#]+)', line)
                  if not match:
                      continue
                  reference = match.group(1)
                  if reference.startswith('./'):
                      continue
                  if '@' not in reference or not re.search(r'@[0-9a-f]{40}$', reference):
                      violations.append(f'{path}:{number}: {reference}')
          if violations:
              raise SystemExit('mutable or unpinned action references:\n' + '\n'.join(violations))
          PY
      - name: Validate programme authority and claim boundaries
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          charter = Path('QTR-CHARTER-00.md').read_text(encoding='utf-8')
          work_package = Path('work-packages/QTR-SIG-WP00.md').read_text(encoding='utf-8')
          manifest = json.loads(Path('MIGRATION_MANIFEST.json').read_text(encoding='utf-8'))
          source = json.loads(Path('evidence/QTR-BOOT-001-source-identity.json').read_text(encoding='utf-8'))

          required = {
              'Status: `candidate`': charter,
              'Target repository: `grandchallenge/QUANTUM-TECHNOLOGIES`': charter,
              'Status: `candidate`': work_package,
          }
          for phrase, text in required.items():
              if phrase not in text:
                  raise SystemExit(f'missing authority boundary: {phrase}')

          if manifest['target_repository'] != 'grandchallenge/QUANTUM-TECHNOLOGIES':
              raise SystemExit('wrong migration target')
          if source['source_commit'] != '33b87f2f15f3af6c6e3b9e38ed3d0d3ba6244835':
              raise SystemExit('mutable or unexpected source identity')
          if source['payload_identity_sha256'] != '5c8bfd314a1bb99004fc96a6b0b02242f22975afa20ac04debb22d5f958c1bd8':
              raise SystemExit('unexpected source payload identity')
          PY
      - name: Confirm adoption remains review-gated
        run: |
          python - <<'PY'
          from pathlib import Path
          charter = Path('QTR-CHARTER-00.md').read_text(encoding='utf-8')
          if 'Until then, its status remains `candidate`.' not in charter:
              raise SystemExit('candidate adoption boundary missing')
          PY
