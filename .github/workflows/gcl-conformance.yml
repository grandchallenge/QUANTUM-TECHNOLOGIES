name: GCL conformance

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: gcl-conformance-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    name: policy
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    env:
      SUBJECT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.SUBJECT_SHA }}
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12.8"
      - name: Assert exact subject checkout
        run: python ci/verify_migration.py --assert-head "$SUBJECT_SHA"
      - name: Reject mutable action references
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          violations = []
          for path in sorted(Path(".github/workflows").glob("*.y*ml")):
              for number, line in enumerate(path.read_text(encoding="utf-8").splitlines(), 1):
                  match = re.search(r"\buses:\s*([^\s#]+)", line)
                  if not match:
                      continue
                  reference = match.group(1)
                  if reference.startswith("./"):
                      continue
                  if "@" not in reference or not re.search(r"@[0-9a-f]{40}$", reference):
                      violations.append(f"{path}:{number}: {reference}")
          if violations:
              raise SystemExit("mutable or unpinned action references:\n" + "\n".join(violations))
          PY
      - name: Validate programme authority and current governance records
        run: |
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          subject = "${{ env.SUBJECT_SHA }}"
          runtime = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          if runtime != subject:
              raise SystemExit(f"evaluated commit mismatch: expected {subject}, observed {runtime}")

          charter = Path("QTR-CHARTER-00.md").read_text(encoding="utf-8")
          work_package = Path("work-packages/QTR-SIG-WP00.md").read_text(encoding="utf-8")
          manifest = json.loads(Path("MIGRATION_MANIFEST.json").read_text(encoding="utf-8"))
          docket = json.loads(Path("reviews/QTR-ADOPT-001/review-docket.json").read_text(encoding="utf-8"))

          for phrase, text in (
              ("Status: `candidate`", charter),
              ("Target repository: `grandchallenge/QUANTUM-TECHNOLOGIES`", charter),
              ("Status: `candidate`", work_package),
          ):
              if phrase not in text:
                  raise SystemExit(f"missing authority boundary: {phrase}")

          if manifest["target_repository"] != "grandchallenge/QUANTUM-TECHNOLOGIES":
              raise SystemExit("wrong migration target")
          if manifest["status"] != "migrated_candidate":
              raise SystemExit("operational migration status is stale")
          historical = manifest["historical_migration"]
          if historical["source_commit"] != "33b87f2f15f3af6c6e3b9e38ed3d0d3ba6244835":
              raise SystemExit("unexpected source commit")
          if historical["target_payload_commit"] != "871da6e9c1953b7dcbbf84a20121995b98d6c366":
              raise SystemExit("unexpected historical target payload commit")

          entry = docket["entry_conditions"]
          if entry["repository_public"] is not True:
              raise SystemExit("repository visibility record is stale")
          if entry["protected_main"]["status"] != "owner_attested":
              raise SystemExit("protected-main record is stale")
          if docket["previous_cycle"]["referee"]["disposition"] != "revise":
              raise SystemExit("previous Referee disposition missing")
          if docket["current_cycle"]["status"] != "corrective_head_pending_replay":
              raise SystemExit("unexpected corrective review status")
          PY
      - name: Confirm adoption remains review-gated
        run: |
          python - <<'PY'
          from pathlib import Path
          charter = Path("QTR-CHARTER-00.md").read_text(encoding="utf-8")
          if "Until then, its status remains `candidate`." not in charter:
              raise SystemExit("candidate adoption boundary missing")
          PY
      - name: Write conformance receipt
        run: |
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          subject = "${{ env.SUBJECT_SHA }}"
          runtime = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          receipt = {
              "receipt_version": "0.2.0",
              "docket_id": "QTR-ADOPT-CORR-001",
              "evaluated_commit": subject,
              "runtime_head": runtime,
              "exact_head_equal": subject == runtime,
              "manifest_status": "migrated_candidate",
              "review_status": "corrective_head_pending_replay",
              "claim_status": "candidate"
          }
          Path("/tmp/QTR-ADOPT-CORR-001-gcl-conformance.json").write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + "\n",
              encoding="utf-8"
          )
          if not receipt["exact_head_equal"]:
              raise SystemExit("conformance receipt head mismatch")
          PY
      - name: Preserve conformance receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: QTR-ADOPT-CORR-001-gcl-conformance
          path: /tmp/QTR-ADOPT-CORR-001-gcl-conformance.json
          if-no-files-found: error
          retention-days: 90
