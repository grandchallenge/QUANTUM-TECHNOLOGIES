name: QTR C90 compact native semantic validation

on:
  pull_request:
    paths:
      - "reference/qtr_c90_exact_native_eval_001.cpp"
      - "reference/qtr_c90_exact_native_validate_001.py"
      - "tests/test_qtr_c90_exact_native_eval_001.py"
      - ".github/workflows/qtr-c90-exact-decoder-001-native-validation.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

env:
  SUBJECT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  COMPILED_RUN_ID: "34947590855"
  COMPILED_ARTIFACT_ID: "10388753864"
  COMPILED_ARTIFACT_NAME: "QTR-C90-compact-native-sum_product_bsc_p_0_1"
  COMPILED_ARTIFACT_DIGEST: "sha256:1d852e71b93a9b1dcff7eba43b29a3f37e3095f63059ed26ab3c512b5d00fc4c"
  COMPILED_SOURCE_HEAD: "c4e1d757bdf89fa5eceaf2e38b8a34ff3ee3a78c"

jobs:
  bounded-checkpoint-control:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SUBJECT_SHA }}
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.8"
      - name: Assert exact validation subject
        run: test "$(git rev-parse HEAD)" = "$SUBJECT_SHA"
      - name: Prove uninterrupted equals checkpoint-resumed on bounded exact controls
        run: python -m unittest tests.test_qtr_c90_exact_native_eval_001 -v

  smoke-050m:
    needs: bounded-checkpoint-control
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SUBJECT_SHA }}
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.8"
      - name: Assert exact validation subject
        run: test "$(git rev-parse HEAD)" = "$SUBJECT_SHA"
      - name: Restore preserved compact-native sum-product artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ env.COMPILED_ARTIFACT_NAME }}
          path: /tmp/c90-compiled
          github-token: ${{ github.token }}
          repository: grandchallenge/QUANTUM-TECHNOLOGIES
          run-id: ${{ env.COMPILED_RUN_ID }}
      - name: Verify artifact, binary, receipt, and frozen selector zero
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/c90-smoke
          python - <<'PY'
          import json, os, sys, urllib.request
          from pathlib import Path
          sys.path.insert(0, 'reference')
          import qtr_c90_exact_decoder_001 as Base
          import qtr_c90_exact_native_validate_001 as V
          req=urllib.request.Request(
              f"https://api.github.com/repos/grandchallenge/QUANTUM-TECHNOLOGIES/actions/artifacts/{os.environ['COMPILED_ARTIFACT_ID']}",
              headers={"Authorization": f"Bearer {os.environ['GH_TOKEN']}", "Accept":"application/vnd.github+json"},
          )
          with urllib.request.urlopen(req) as response:
              meta=json.load(response)
          assert str(meta['id']) == os.environ['COMPILED_ARTIFACT_ID']
          assert meta['name'] == os.environ['COMPILED_ARTIFACT_NAME']
          assert meta['digest'] == os.environ['COMPILED_ARTIFACT_DIGEST']
          assert meta['expired'] is False
          receipt=Path('/tmp/c90-compiled/compile-sum_product_bsc_p_0_1.json')
          binary=Path('/tmp/c90-compiled/compiled-sum_product_bsc_p_0_1.qtrbin')
          r=V._load_receipt(receipt, 'sum_product_bsc_p_0_1')
          assert r['source_commit'] == os.environ['COMPILED_SOURCE_HEAD']
          sha=V._file_sha256(binary)
          assert sha == r['compiled']['native_binary_sha256']
          coords=Base.frozen_validation_coordinates()
          assert Base.digest(coords) == Base.C90_VALIDATION_SET_SHA
          Path('/tmp/c90-smoke/selector0.txt').write_text(f"0 {coords[0]}\n", encoding='utf-8')
          Path('/tmp/c90-smoke/binding.txt').write_text(sha+'\n', encoding='utf-8')
          print('C90_COMPILED_ARTIFACT_IDENTITY_PASS', meta['id'], meta['digest'], sha, coords[0])
          PY
      - name: Build exact checkpoint-capable evaluator
        run: g++ -std=c++17 -O3 -DNDEBUG reference/qtr_c90_exact_native_eval_001.cpp -o /tmp/qtr-c90-native-eval
      - name: Evaluate selector zero through node 50M
        run: |
          BINDING="$(cat /tmp/c90-smoke/binding.txt)"
          /usr/bin/time -v /tmp/qtr-c90-native-eval \
            --native /tmp/c90-compiled/compiled-sum_product_bsc_p_0_1.qtrbin \
            --selectors /tmp/c90-smoke/selector0.txt \
            --checkpoint-out /tmp/c90-smoke/checkpoint-050m.bin \
            --checkpoint-binding "$BINDING" \
            --stop-node 50000000 | tee /tmp/c90-smoke/checkpoint-050m.jsonl
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('/tmp/c90-smoke/checkpoint-050m.jsonl').read_text())
          assert r['status']=='C90_COMPACT_NATIVE_SELECTOR_CHECKPOINTED'
          assert r['next_node']==50000000
          assert r['quality_exposed'] is False
          PY
      - name: Preserve 50M exact execution checkpoint
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: QTR-C90-selector0-checkpoint-050m
          path: |
            /tmp/c90-smoke/checkpoint-050m.bin
            /tmp/c90-smoke/checkpoint-050m.jsonl
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

