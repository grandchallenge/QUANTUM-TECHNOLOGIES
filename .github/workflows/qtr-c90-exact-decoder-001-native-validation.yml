      - name: Preserve 100M exact execution checkpoint
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: QTR-C90-selector0-checkpoint-100m
          path: |
            /tmp/c90-smoke/checkpoint-100m.bin
            /tmp/c90-smoke/checkpoint-100m.jsonl
