          python - <<'PY'
          import json, os, sys, urllib.request
          from pathlib import Path
          sys.path.insert(0,'reference')
          import qtr_c90_exact_native_validate_001 as V
          req=urllib.request.Request(f"https://api.github.com/repos/grandchallenge/QUANTUM-TECHNOLOGIES/actions/artifacts/{os.environ['COMPILED_ARTIFACT_ID']}",headers={"Authorization":f"Bearer {os.environ['GH_TOKEN']}","Accept":"application/vnd.github+json"})
