          PY
      - name: Build exact checkpoint-capable evaluator
        run: g++ -std=c++17 -O3 -DNDEBUG reference/qtr_c90_exact_native_eval_001.cpp -o /tmp/qtr-c90-native-eval
      - name: Bind validator to 200M checkpoint-resume evaluator
        run: |
          cat > /tmp/qtr-c90-native-eval-resume <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          exec /tmp/qtr-c90-native-eval "$@" \
            --checkpoint-in /tmp/c90-resume/checkpoint-200m.bin \
            --checkpoint-binding "$(cat /tmp/c90-smoke/binding.txt)"
          SH
          chmod +x /tmp/qtr-c90-native-eval-resume
      - name: Complete selector zero and compare against independent direct contraction
        run: |
          /usr/bin/time -v python reference/qtr_c90_exact_native_validate_001.py \
            --algebra sum_product_bsc_p_0_1 \
            --native-executable /tmp/qtr-c90-native-eval-resume \
            --native-binary /tmp/c90-compiled/compiled-sum_product_bsc_p_0_1.qtrbin \
            --compiled-receipt /tmp/c90-compiled/compile-sum_product_bsc_p_0_1.json \
            --start 0 \
            --stop 1 \
            --output /tmp/c90-smoke/validate-smoke.json
          python - <<'PY'
          import hashlib, json, os, platform, subprocess, sys
          from datetime import datetime, timezone
          from pathlib import Path
          sys.path.insert(0,'reference')
          import qtr_c90_exact_decoder_001 as Base
          r=json.loads(Path('/tmp/c90-smoke/validate-smoke.json').read_text())
          assert r['status']=='C90_EXACT_ALGEBRA_VALIDATION_SHARD_PASSED'
          assert r['selector_count']==1 and r['all_exact_equal'] is True and r['quality_exposed'] is False
          row=r['rows'][0]; assert row['selector_index']==0 and row['exact_equal'] is True
          def fsha(path):
              h=hashlib.sha256(); h.update(Path(path).read_bytes()); return h.hexdigest()
          gate={
              'experiment_id': r['experiment_id'],
              'phase': 'QUALITY_BLIND_FULL_SCALE_SELECTOR_ZERO_GATE',
              'status': 'C90_FULL_SCALE_NATIVE_SEMANTIC_SMOKE_PASS',
              'validation_subject_commit': os.environ['SUBJECT_SHA'],
              'compiled_source_commit': r['compiled_source_commit'],
              'compiled_artifact': {
                  'workflow_run_id': int(os.environ['COMPILED_RUN_ID']),
                  'artifact_id': int(os.environ['COMPILED_ARTIFACT_ID']),
                  'artifact_name': os.environ['COMPILED_ARTIFACT_NAME'],
                  'artifact_digest': os.environ['COMPILED_ARTIFACT_DIGEST'],
                  'native_binary_sha256': r['compiled_native_binary_sha256'],
                  'canonical_node_stream_sha256': r['compiled_canonical_node_stream_sha256'],
              },
              'selector_index': row['selector_index'],
              'selector_coordinate': row['selector_coordinate'],
              'native_exact_value': row['value_encoding'],
              'direct_oracle_exact_value': row['value_encoding'],
              'exact_equal': True,
              'reachable_nodes': row['reachable_nodes'],
              'peak_live_values': row['peak_live_values'],
              'checkpoint_resume': {
                  'format': 'QTRC90E1',
                  'boundaries': [50000000,100000000,150000000,200000000],
                  'scientific_semantics_changed': False,
              },
              'execution_metadata': {
                  'github_run_id': int(os.environ['GITHUB_RUN_ID']),
                  'github_run_attempt': int(os.environ['GITHUB_RUN_ATTEMPT']),
                  'github_job': os.environ['GITHUB_JOB'],
