name: QTR C90 exact structural work

on:
  pull_request:
    paths:
      - 'registry/qtr-c90-structure-001-manifest.json'
      - 'registry/qtr-c90-structure-001.json'
      - 'evidence/QTR-C90-STRUCTURE-001-report.json'
      - 'configs/compute/qtr_c90_structure_001_job.json'
      - 'reference/qtr_c90_structure_001.py'
      - 'colab/qtr_c90_structure_remote_job.py'
      - 'scripts/run_qtr_c90_structure_colab.sh'
      - 'tests/test_qtr_c90_structure_001.py'
      - 'work-packages/QTR-C90-STRUCTURE-001.md'
      - '.github/workflows/qtr-c90-structure-001.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  structural-phase-b-c:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
      - name: Verify exact subject
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Run bounded structure contract tests
        run: |
          python -m unittest tests.test_qtr_c90_structure_001 -v
      - name: Run control certification and non-materializing C90 Phase C
        run: |
          python reference/qtr_c90_structure_001.py \
            --phase static \
            --output "$RUNNER_TEMP/QTR-C90-STRUCTURE-001-static.json"
      - name: Assert bounded candidate state
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python - "$RUNNER_TEMP/QTR-C90-STRUCTURE-001-static.json" "$EXPECTED_HEAD" <<'PY'
          import json,sys
          path,head=sys.argv[1:]
          r=json.load(open(path,encoding="utf-8"))
          assert r["source_commit"]==head
          assert r["status"]=="candidate_executable_not_promoted"
          assert r["s0_replay"]["matches_protected_predecessor"] is True
          assert r["s1_eligibility"]["hard_affine_factor_count"]==0
          assert list(r["control_certification"])==["S0_BASELINE","S1_GF2_CONSTRAINT_ELIMINATION","S2_SEPARATOR_INTERFACE_COMPILATION","S3_GF2_PLUS_SEPARATOR"]
          assert list(r["c90_methods"])==list(r["control_certification"])
          assert r["phase_d_reached"] is False
          assert r["phase_e_reached"] is False
          print("phase_c_disposition=",r["phase_c_disposition"])
          print("overall_outcome=",r["overall_outcome"])
          for name,row in r["c90_methods"].items(): print(name,row["control_status"],row["c90_status"])
          print("payload_sha256=",r["payload_sha256"])
          PY
      - name: Verify committed candidate evidence when present
        run: |
          python - "$RUNNER_TEMP/QTR-C90-STRUCTURE-001-static.json" <<'PY'
          import hashlib,json,pathlib,sys
          static=json.load(open(sys.argv[1],encoding="utf-8"))
          path=pathlib.Path("evidence/QTR-C90-STRUCTURE-001-report.json")
          if not path.exists():
              print("candidate evidence not yet committed: pre-outcome/static-measurement head")
              raise SystemExit(0)
          ev=json.load(open(path,encoding="utf-8"))
          claimed=ev.pop("payload_sha256")
          raw=json.dumps(ev,sort_keys=True,separators=(",",":"),ensure_ascii=True,allow_nan=False).encode()
          assert hashlib.sha256(raw).hexdigest()==claimed
          ev["payload_sha256"]=claimed
          assert ev["status"]=="candidate_executable_not_promoted"
          assert ev["manifest_payload_sha256"]==static["manifest_payload_sha256"]
          assert ev["s0_replay"]==static["s0_replay"]
          assert ev["s1_eligibility"]==static["s1_eligibility"]
          assert ev["phase_c_disposition"]==static["phase_c_disposition"]
          assert ev["overall_outcome"]==static["overall_outcome"]
          assert ev["phase_d_reached"]==static["phase_d_reached"] is False
          assert ev["phase_e_reached"]==static["phase_e_reached"] is False
          assert ev["claim_boundary"]==static["claim_boundary"]
          summary={}
          for name,row in static["control_certification"].items():
              cell={"status":row["status"]}
              if "hard_affine_factor_count" in row: cell["hard_affine_factor_count"]=row["hard_affine_factor_count"]
              if name in {"S2_SEPARATOR_INTERFACE_COMPILATION","S3_GF2_PLUS_SEPARATOR"}:
                  for key in ("validation_count","validation_outputs_sha256","protected_validation_outputs_sha256","transformation_receipt_sha256","compiled_descriptor_sha256"): cell[key]=row.get(key)
              summary[name]=cell
          assert ev["control_certification_summary"]==summary
          for name,row in static["c90_methods"].items():
              cell=ev["c90_methods"][name]
              assert cell["control_status"]==row["control_status"]
              assert cell["c90_status"]==row["c90_status"]
              assert cell["transformation_receipt_sha256"]==row["transformation_receipt_sha256"]
              assert cell["order_sha256"]==row["order_sha256"]
              assert cell["factor_or_constraint_evaluations"]==row["cap_checks"]["factor_or_constraint_evaluations"]
              assert cell["peak_joint_or_interface"]==row["cap_checks"]["peak_joint_or_interface"]
              assert cell["aop"]==row["cap_checks"]["aop"]
              assert cell["retained"]==row["cap_checks"]["retained"]
              assert cell["normalized_ledger"]==row["normalized_ledger"]
              assert cell["first_crossed_step_zero_based"]==row["first_crossed_step_zero_based"]
          print("candidate_evidence_payload_sha256=",claimed)
          print("measurement_static_report_payload_sha256=",ev["measurement"]["static_report_payload_sha256"])
          PY
      - name: Preserve exact-head structural candidate artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: qtr-c90-structure-001-static
          path: ${{ runner.temp }}/QTR-C90-STRUCTURE-001-static.json
          if-no-files-found: error
