name: QTR C90 compact native semantic validation smoke

on:
  pull_request:
    paths:
      - "reference/qtr_c90_exact_native_eval_001.cpp"
      - "reference/qtr_c90_exact_native_validate_001.py"
      - ".github/workflows/qtr-c90-exact-decoder-001-native-validation-smoke.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

env:
  SUBJECT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  COMPILED_RUN_ID: "34947590855"

jobs:
  sum-product-selector-zero:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SUBJECT_SHA }}
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.8"
      - name: Assert exact validation subject
        run: test "$(git rev-parse HEAD)" = "$SUBJECT_SHA"
      - name: Restore successful compact-native sum-product artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: QTR-C90-compact-native-sum_product_bsc_p_0_1
          path: /tmp/c90-compiled
          github-token: ${{ github.token }}
          repository: grandchallenge/QUANTUM-TECHNOLOGIES
          run-id: ${{ env.COMPILED_RUN_ID }}
      - name: Build exact compact-native evaluator
        run: g++ -std=c++17 -O3 -DNDEBUG reference/qtr_c90_exact_native_eval_001.cpp -o /tmp/qtr-c90-native-eval
      - name: Validate frozen selector index zero exactly
        run: |
          mkdir -p /tmp/c90-validation
          /usr/bin/time -v python reference/qtr_c90_exact_native_validate_001.py \
            --algebra sum_product_bsc_p_0_1 \
            --native-executable /tmp/qtr-c90-native-eval \
            --native-binary /tmp/c90-compiled/compiled-sum_product_bsc_p_0_1.qtrbin \
            --compiled-receipt /tmp/c90-compiled/compile-sum_product_bsc_p_0_1.json \
            --start 0 \
            --stop 1 \
            --output /tmp/c90-validation/validate-sum_product_bsc_p_0_1-smoke.json
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('/tmp/c90-validation/validate-sum_product_bsc_p_0_1-smoke.json')
          r=json.loads(p.read_text())
          assert r['status']=='C90_EXACT_ALGEBRA_VALIDATION_SHARD_PASSED'
          assert r['selector_index_start']==0 and r['selector_index_stop']==1
          assert r['selector_count']==1
          assert r['all_exact_equal'] is True
          assert r['quality_exposed'] is False
          assert r['injected_error_success_used'] is False
          print('C90_NATIVE_FULL_SCALE_VALIDATION_SMOKE_PASS', r['rows_sha256'])
          print('reachable_nodes', r['rows'][0]['reachable_nodes'])
          print('peak_live_values', r['rows'][0]['peak_live_values'])
          PY
      - name: Preserve quality-blind smoke receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: QTR-C90-compact-native-validation-smoke
          path: /tmp/c90-validation/validate-sum_product_bsc_p_0_1-smoke.json
          if-no-files-found: error
          retention-days: 90
