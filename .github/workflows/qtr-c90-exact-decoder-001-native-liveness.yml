name: QTR C90 compact native validation liveness

on:
  pull_request:
    paths:
      - "reference/qtr_c90_exact_native_liveness_001.cpp"
      - ".github/workflows/qtr-c90-exact-decoder-001-native-liveness.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

env:
  SUBJECT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  COMPILED_RUN_ID: "34947590855"

jobs:
  liveness:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SUBJECT_SHA }}
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.8"
      - name: Assert quality-blind benchmark subject
        run: test "$(git rev-parse HEAD)" = "$SUBJECT_SHA"
      - name: Restore successful compact-native sum-product artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: QTR-C90-compact-native-sum_product_bsc_p_0_1
          path: /tmp/c90-compact-native
          github-token: ${{ github.token }}
          repository: grandchallenge/QUANTUM-TECHNOLOGIES
          run-id: ${{ env.COMPILED_RUN_ID }}
      - name: Generate frozen selector batch probes
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, 'reference')
          import qtr_c90_exact_decoder_001 as Base
          coordinates = Base.frozen_validation_coordinates()
          assert len(coordinates) == 307
          assert Base.digest(coordinates) == Base.C90_VALIDATION_SET_SHA
          batches = {
              'single_zero': [coordinates[0]],
              'single_random': [coordinates[-1]],
              'random_2': coordinates[-2:],
              'random_4': coordinates[-4:],
              'random_8': coordinates[-8:],
              'random_16': coordinates[-16:],
              'random_32': coordinates[-32:],
              'random_64': coordinates[-64:],
              'all_307': coordinates,
          }
          for name, values in batches.items():
              Path(f'/tmp/c90-selectors-{name}.txt').write_text(
                  ''.join(f'{x}\n' for x in values), encoding='utf-8'
              )
          print('validation_set_sha256', Base.C90_VALIDATION_SET_SHA)
          print('batch_sizes', {k: len(v) for k, v in batches.items()})
          PY
      - name: Build quality-blind liveness probe
        run: g++ -std=c++17 -O3 -DNDEBUG reference/qtr_c90_exact_native_liveness_001.cpp -o /tmp/qtr-c90-native-liveness
      - name: Characterize exact selector-batch live frontiers
        run: |
          : > /tmp/QTR-C90-native-liveness.jsonl
          for name in single_zero single_random random_2 random_4 random_8 random_16 random_32 random_64 all_307; do
            printf '{"batch":"%s","measurement":' "$name" >> /tmp/QTR-C90-native-liveness.jsonl
            /tmp/qtr-c90-native-liveness \
              --native /tmp/c90-compact-native/compiled-sum_product_bsc_p_0_1.qtrbin \
              --selectors "/tmp/c90-selectors-$name.txt" \
              | tr -d '\n' >> /tmp/QTR-C90-native-liveness.jsonl
            printf '}\n' >> /tmp/QTR-C90-native-liveness.jsonl
          done
          cat /tmp/QTR-C90-native-liveness.jsonl
          grep -q '"batch":"single_zero"' /tmp/QTR-C90-native-liveness.jsonl
          grep -q '"batch":"all_307"' /tmp/QTR-C90-native-liveness.jsonl
          test "$(grep -c '"quality_exposed":false' /tmp/QTR-C90-native-liveness.jsonl)" -eq 9
