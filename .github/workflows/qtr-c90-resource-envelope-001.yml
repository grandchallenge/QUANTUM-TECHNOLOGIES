name: QTR C90 resource-envelope calibration

on:
  pull_request:
    paths:
      - 'registry/qtr-c90-resource-envelope-001-manifest.json'
      - 'registry/qtr-c90-resource-envelope-001.json'
      - 'reference/qtr_c90_resource_envelope_001.py'
      - 'colab/qtr_c90_resource_envelope_remote_job.py'
      - 'configs/compute/qtr_c90_resource_envelope_001_job.json'
      - 'scripts/run_qtr_c90_resource_envelope_colab.sh'
      - 'tests/test_qtr_c90_resource_envelope_001.py'
      - 'work-packages/QTR-C90-RESOURCE-ENVELOPE-001.md'
      - '.github/workflows/qtr-c90-resource-envelope-001.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  calibration-static:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
      - name: Verify exact subject
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Run bounded calibration contract tests
        run: |
          python -m unittest tests.test_qtr_c90_resource_envelope_001 -v
      - name: Run non-materializing sensitivity and representation audit
        run: |
          python reference/qtr_c90_resource_envelope_001.py static \
            --output "$RUNNER_TEMP/QTR-C90-RESOURCE-ENVELOPE-001-static.json"
      - name: Assert pre-outcome bounded state
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python - "$RUNNER_TEMP/QTR-C90-RESOURCE-ENVELOPE-001-static.json" "$EXPECTED_HEAD" <<'PY'
          import json,sys
          path,head=sys.argv[1:]
          r=json.load(open(path,encoding="utf-8"))
          assert r["source_commit"]==head
          assert r["status"]=="candidate_executable_not_promoted"
          assert r["materialization_performed"] is False
          assert r["physical_probe_performed"] is False
          assert r["manifest_payload_sha256"]=="d64b770f5cc1fb4c8a0ca8e89dad6d8020a01ae38f2c6868ff3028f53c441651"
          assert list(r["methods"])==["S0_BASELINE","S1_GF2_CONSTRAINT_ELIMINATION","S2_SEPARATOR_INTERFACE_COMPILATION","S3_GF2_PLUS_SEPARATOR"]
          print("payload_sha256=",r["payload_sha256"])
          for name,row in r["methods"].items():
              print(name,row["first_coordinate_clearing_definite_historical_blockers"],row["first_certified_cumulative_work_coordinate"])
          PY
      - name: Preserve exact-head calibration static artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: qtr-c90-resource-envelope-001-static
          path: ${{ runner.temp }}/QTR-C90-RESOURCE-ENVELOPE-001-static.json
          if-no-files-found: error
