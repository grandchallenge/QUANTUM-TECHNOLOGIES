name: QTR C90 retained-node bound audit

on:
  pull_request:
    paths:
      - 'registry/qtr-c90-retained-bound-001-manifest.json'
      - 'registry/qtr-c90-retained-bound-001.json'
      - 'reference/qtr_c90_retained_bound_001.py'
      - 'configs/compute/qtr_c90_retained_bound_001_job.json'
      - 'tests/test_qtr_c90_retained_bound_001.py'
      - 'work-packages/QTR-C90-RETAINED-BOUND-001.md'
      - '.github/workflows/qtr-c90-retained-bound-001.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retained-bound:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Verify exact frozen subject
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - name: Verify manifest and bounded implementation tests
        run: |
          python -m unittest tests.test_qtr_c90_retained_bound_001 -v

      - name: Exact C72 control certification
        run: |
          python reference/qtr_c90_retained_bound_001.py control \
            --output "$RUNNER_TEMP/QTR-C90-RETAINED-BOUND-001-control.json"

      - name: Assert control creates no C90 authority or outcome
        run: |
          python - "$RUNNER_TEMP/QTR-C90-RETAINED-BOUND-001-control.json" <<'PY'
          import json,sys
          r=json.load(open(sys.argv[1],encoding="utf-8"))
          assert r["phase"]=="CONTROL_CERTIFICATION"
          assert r["c90_bound_computation_performed"] is False
          assert r["c90_materialization_performed"] is False
          assert r["manifest_payload_sha256"]=="d9072de9631901a0b97df61c14b8c5dc9d5de7d21ad9d7e181765c69fad223c2"
          print("control_payload_sha256=",r["payload_sha256"])
          print("admitted=",r["refinement_admitted_for_c90"])
          PY

      - name: Non-materializing C90 canonical-node bound
        run: |
          python reference/qtr_c90_retained_bound_001.py c90 \
            --control "$RUNNER_TEMP/QTR-C90-RETAINED-BOUND-001-control.json" \
            --output "$RUNNER_TEMP/QTR-C90-RETAINED-BOUND-001-report.json"

      - name: Assert bounded terminal schema
        run: |
          python - "$RUNNER_TEMP/QTR-C90-RETAINED-BOUND-001-report.json" <<'PY'
          import json,sys
          r=json.load(open(sys.argv[1],encoding="utf-8"))
          allowed={
            "C90_CANONICAL_NODE_BOUND_CERTIFIES_PHYSICAL_ENVELOPE_CANDIDATE",
            "C90_CANONICAL_NODE_BOUND_TIGHTENED__PHYSICAL_GATE_STILL_UNCERTIFIED",
            "C90_CANONICAL_NODE_BOUND_NO_MATERIAL_TIGHTENING",
            "C90_CANONICAL_NODE_BOUND_AUDIT_INDETERMINATE",
          }
          assert r["adjudication"]["overall_outcome"] in allowed
          assert r["c90_materialization_performed"] is False
          assert r["frozen_307_validation_performed"] is False
          assert r["adjudication"]["full_c90_materialization_authorized"] is False
          assert r["manifest_payload_sha256"]=="d9072de9631901a0b97df61c14b8c5dc9d5de7d21ad9d7e181765c69fad223c2"
          print("outcome=",r["adjudication"]["overall_outcome"])
          print("payload_sha256=",r["payload_sha256"])
          PY

      - name: Preserve exact-head bound artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: qtr-c90-retained-bound-001
          path: |
            ${{ runner.temp }}/QTR-C90-RETAINED-BOUND-001-control.json
            ${{ runner.temp }}/QTR-C90-RETAINED-BOUND-001-report.json
          if-no-files-found: error
