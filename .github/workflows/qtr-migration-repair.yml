name: QTR migration repair

on:
  push:
    branches:
      - agent/qtr-adoption
    paths:
      - ".github/workflows/qtr-migration-repair.yml"

permissions:
  contents: write

concurrency:
  group: qtr-migration-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: agent/qtr-adoption
      - name: Fetch exact admitted WP00 bytes
        run: |
          set -euo pipefail
          source_url="https://raw.githubusercontent.com/grandchallenge/.github/33b87f2f15f3af6c6e3b9e38ed3d0d3ba6244835/incubation/quantum-technologies-research/work-packages/QTR-SIG-WP00.md"
          curl --fail --location --silent --show-error "$source_url" -o /tmp/QTR-SIG-WP00.md
          echo "d6f7e373c6b5a1f23ccbde94b85ba9bb0621a49dd8f7bf35093598bed987317e  /tmp/QTR-SIG-WP00.md" | sha256sum --check --strict
          cmp --silent /tmp/QTR-SIG-WP00.md work-packages/QTR-SIG-WP00.md || cp /tmp/QTR-SIG-WP00.md work-packages/QTR-SIG-WP00.md
      - name: Commit exact repair when required
        run: |
          if git diff --quiet -- work-packages/QTR-SIG-WP00.md; then
            echo "WP00 already matches the admitted source."
            exit 0
          fi
          git config user.name "gcl-qtr-migration-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add work-packages/QTR-SIG-WP00.md
          git commit -m "Restore exact admitted QTR-SIG-WP00 bytes"
          git push origin HEAD:agent/qtr-adoption
