name: TCM C72 exact interface preflight

on:
  pull_request:
    paths:
      - 'registry/tcm-c72-interface-001-manifest.json'
      - 'registry/tcm-c72-interface-001.json'
      - 'reference/tcm_c72_interface_001.py'
      - 'colab/tcm_c72_interface_001_remote_job.py'
      - 'configs/compute/tcm_c72_interface_001_job.json'
      - 'tests/test_tcm_c72_interface_001.py'
      - 'work-packages/QTR-TCM-C72-INTERFACE-001.md'
      - '.github/workflows/qtr-tcm-c72-interface-001.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  c72-interface-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Verify exact subject checkout
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - name: Static and adversarial interface tests
        run: |
          python -m unittest tests.test_tcm_c72_interface_001 -v

      - name: Exact C18 control and C72 interface preflight only
        run: |
          python reference/tcm_c72_interface_001.py \
            --mode preflight \
            --output "$RUNNER_TEMP/TCM-C72-INTERFACE-001-preflight.json"

      - name: Assert CI produced no C72 decoder-quality outcome
        run: |
          python - "$RUNNER_TEMP/TCM-C72-INTERFACE-001-preflight.json" <<'PY'
          import json,sys
          r=json.load(open(sys.argv[1],encoding="utf-8"))
          assert r["status"]=="PREFLIGHT_PASS__NO_C72_DECODER_OUTCOME"
          assert r["manifest_payload_sha256"]=="35e3715fa9b1d0d44cad63c8cafbee01a42c3426c7db21c37d3ff68073506ddf"
          assert r["c18_control"]["status"]=="PASS"
          assert r["c72_static"]["corpus_size"]==329
          assert r["c72_static"]["injected_error_available_to_decoder"] is False
          assert "adjudication" not in r
          assert "totals" not in r.get("c72_static",{})
          print("selector_map_sha256=",r["c72_static"]["selector_map_sha256"])
          print("c72_quality_outcome=NOT_RUN")
          PY

      - name: Preserve exact-head preflight artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: tcm-c72-interface-001-preflight
          path: ${{ runner.temp }}/TCM-C72-INTERFACE-001-preflight.json
          if-no-files-found: error
