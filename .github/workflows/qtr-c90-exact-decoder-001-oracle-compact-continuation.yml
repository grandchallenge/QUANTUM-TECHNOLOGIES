name: QTR C90 selector-zero oracle compact continuation

on:
  pull_request:
    paths:
      - ".github/workflows/qtr-c90-exact-decoder-001-oracle-compact-continuation.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

env:
  SUBJECT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  RECOVERY_BASE_HEAD: "c1cf845d9e36e1d6dee489f5bc3752a0302da12d"
  STEP20_RUN_ID: "35048121598"
  STEP20_ARTIFACT_ID: "10428160711"
  STEP20_ARTIFACT_NAME: "QTR-C90-oracle-selector0-step-20-compact"
  STEP20_ARTIFACT_DIGEST: "sha256:630169189457dd4ff31ea8a14284a02ba1ccefcbf05007b1bc3d15256355e5f3"
  ORACLE_BLOB_SHA1: "c48e738b25d336137d3e48b944bde4a9abd08e27"
  DAG_BLOB_SHA1: "bb2576ea17beb43f1a188eb4a77a280869d0c954"
  COMPACTOR_BLOB_SHA1: "5d8fdc115d25af70465a0ad3635eb558f60d90f8"

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SUBJECT_SHA }}
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.8"
      - name: Assert exact continuation subject
        run: |
          test "$(git rev-parse HEAD)" = "$SUBJECT_SHA"
          test "$(git hash-object reference/qtr_c90_exact_oracle_checkpoint_001.py)" = "$ORACLE_BLOB_SHA1"
          test "$(git hash-object reference/qtr_c90_exact_dag_001.py)" = "$DAG_BLOB_SHA1"
          test "$(git hash-object reference/qtr_c90_exact_oracle_compact_001.py)" = "$COMPACTOR_BLOB_SHA1"
          mapfile -t CHANGED < <(git diff --name-only "$RECOVERY_BASE_HEAD" "$SUBJECT_SHA")
          test "${#CHANGED[@]}" -eq 1
          test "${CHANGED[0]}" = ".github/workflows/qtr-c90-exact-decoder-001-oracle-compact-continuation.yml"
      - name: Verify durable exact step-20 checkpoint identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          req=urllib.request.Request(
              f"https://api.github.com/repos/grandchallenge/QUANTUM-TECHNOLOGIES/actions/artifacts/{os.environ['STEP20_ARTIFACT_ID']}",
              headers={"Authorization":f"Bearer {os.environ['GH_TOKEN']}","Accept":"application/vnd.github+json"},
          )
          with urllib.request.urlopen(req) as response:
              meta=json.load(response)
          assert str(meta['id']) == os.environ['STEP20_ARTIFACT_ID']
          assert meta['name'] == os.environ['STEP20_ARTIFACT_NAME']
          assert meta['digest'] == os.environ['STEP20_ARTIFACT_DIGEST']
          assert meta['expired'] is False
          assert str(meta['workflow_run']['id']) == os.environ['STEP20_RUN_ID']
          assert meta['workflow_run']['head_sha'] == os.environ['RECOVERY_BASE_HEAD']
          print('C90_STEP20_CONTINUATION_IDENTITY_PASS', meta['id'], meta['digest'])
          PY

  advance-21:
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { ref: "${{ env.SUBJECT_SHA }}", fetch-depth: 0 }
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.12.8" }
      - name: Restore compact step 20
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: QTR-C90-oracle-selector0-step-20-compact
          path: /tmp/c90-prev
          github-token: ${{ github.token }}
          repository: grandchallenge/QUANTUM-TECHNOLOGIES
          run-id: ${{ env.STEP20_RUN_ID }}
      - name: Advance 20 to 21 and compact exact state
        run: |
          mkdir -p /tmp/c90-next
          /usr/bin/time -v python reference/qtr_c90_exact_oracle_compact_001.py \
            --algebra sum_product_bsc_p_0_1 --coordinate 0 \
            --advance-to 21 \
            --checkpoint-in /tmp/c90-prev/oracle-20-compact.pkl \
            --checkpoint-receipt-in /tmp/c90-prev/oracle-20-compact.json \
            --checkpoint-out /tmp/c90-next/oracle-21-compact.pkl \
            --checkpoint-receipt-out /tmp/c90-next/oracle-21-compact.json \
            --report-out /tmp/c90-next/oracle-21-compact-report.json
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('/tmp/c90-next/oracle-21-compact-report.json').read_text())
          assert r['status']=='C90_NUMERIC_ORACLE_EXACT_GC_PASS'
          assert r['input_next_step']==20 and r['output_next_step']==21
          assert r['reachable_semantics_changed'] is False
          assert r['quality_exposed'] is False
          assert r['injected_error_success_used'] is False
          print('C90_STEP21_EXACT_GC_PASS', r['source_node_count'], r['retained_node_count'], r['removed_node_count'])
          PY
      - name: Preserve compact exact step 21
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: QTR-C90-oracle-selector0-step-21-compact
          path: /tmp/c90-next/*
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

